<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Icon Box -->
  <rect x="8" y="20" width="72" height="72" rx="18" fill="url(#iconBg)" filter="url(#shadow)"/>
  
  <!-- Shopping Bag Icon -->
  <path d="M30 52 L34 36 L50 36 L54 52" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="46" width="28" height="26" rx="4" fill="none" stroke="white" stroke-width="3"/>
  <line x1="38" y1="46" x2="38" y2="52" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="46" x2="50" y2="52" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- N Monogram -->
  <text x="44" y="78" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white" text-anchor="middle">N</text>

  <!-- Brand Name -->
  <text x="100" y="58" font-family="'Inter', Arial, sans-serif" font-size="34" font-weight="800" fill="#f0f2f8" letter-spacing="-0.5">Nexdo</text>
  <text x="100" y="86" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="800" fill="url(#brand)" letter-spacing="1">SHOPPERS</text>
  
  <!-- Tagline -->
  <text x="100" y="104" font-family="'Inter', Arial, sans-serif" font-size="10" fill="#9aa5c3" letter-spacing="1.5">KAMPALA'S PREMIUM GADGET STORE</text>

  <!-- Decorative dot -->
  <circle cx="293" cy="86" r="3" fill="#f97316"/>
</svg>
